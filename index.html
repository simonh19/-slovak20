<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Slovak 20</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:680px;margin:auto;padding:18px 16px 42px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:3px}.pill{background:#111827;color:#fff;padding:8px 11px;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.stat{background:#fff;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#6b7280}.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#111827;width:0;transition:.2s}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{border:0;border-radius:99px;padding:9px 12px;background:#e5e7eb;white-space:nowrap}.tab.active{background:#111827;color:#fff}.card{background:#fff;border-radius:25px;min-height:390px;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 7px 28px #0001}.label{font-size:11px;color:#9ca3af;letter-spacing:.1em}.word{font-size:40px;font-weight:800;margin:25px 0 10px;line-height:1.1}.answer{font-size:29px;font-weight:750;margin:12px 0}.example{font-size:15px;color:#4b5563;line-height:1.5;max-width:500px}.main{width:100%;margin-top:14px;border:0;border-radius:15px;background:#111827;color:#fff;padding:15px;font-weight:750;font-size:16px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.ratings button{border:0;border-radius:14px;padding:12px 3px;font-weight:700;font-size:12px}.again{background:#fee2e2}.hard{background:#fef3c7}.good{background:#dcfce7}.easy{background:#dbeafe}.audio{border:0;border-radius:13px;padding:10px 14px;margin-top:12px;background:#e5e7eb}.panel{background:#fff;border-radius:18px;padding:16px;margin-top:14px}.panel select{width:100%;padding:11px;border-radius:11px;border:1px solid #d1d5db;background:#fff}.hidden{display:none!important}.done{text-align:center;padding:60px 15px}.reset{margin-top:12px;border:0;background:#e5e7eb;border-radius:12px;padding:11px}.hint{font-size:12px;color:#9ca3af;margin-top:12px}</style></head><body><main class="app"><header><div><h1>Slovak 20</h1><div class="sub" id="subtitle">Lade Karten…</div></div><div class="pill" id="streak">🔥 0</div></header><div class="stats"><div class="stat"><b id="due">0</b><span>fällig</span></div><div class="stat"><b id="known">0</b><span>gelernt</span></div><div class="stat"><b id="today">0</b><span>heute</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div><div id="area"><div class="card"><div class="word">Lade deine Karten…</div></div></div><div class="panel"><select id="mode"></select><button class="reset" id="reset">Lernstand zurücksetzen</button><div class="hint">Anki-Style: Nochmal = vergessen · Schwer = unsicher · Gut = gewusst · Leicht = sofort gewusst.</div></div></main><script>let CARDS=[],S=JSON.parse(localStorage.getItem('slovak20-state-v3')||'{}'),mode='all',cur=null;S.cards=S.cards||{};S.day=S.day||new Date().toISOString().slice(0,10);S.today=S.today||0;S.streak=S.streak||0;const KEY='slovak20-state-v3';function save(){localStorage.setItem(KEY,JSON.stringify(S))}function dayCheck(){let t=new Date().toISOString().slice(0,10);if(S.day!==t){let a=new Date(S.day),b=new Date(t);S.streak=((b-a)/86400000===1)?S.streak+1:1;S.day=t;S.today=0;save()}}function due(){let n=Date.now();return CARDS.map((x,i)=>({x,i})).filter(o=>(mode==='all'||o.x[3]===mode)&&(!S.cards[o.i]||S.cards[o.i].due<=n)).sort((a,b)=>(S.cards[a.i]?.due||0)-(S.cards[b.i]?.due||0))}function schedule(old,r){let st=old.st||0.5,d=old.d||5;if(r==='again'){st=Math.max(.2,st*.35);d=Math.min(10,d+.8);return[st,d,1]}if(r==='hard'){st*=1.35;d=Math.min(10,d+.15);return[st,d,Math.max(2,Math.round(st*1.5))]}if(r==='good'){st*=2.4;d=Math.max(1,d-.15);return[st,d,Math.max(3,Math.round(st*3.2))]}st*=3.7;d=Math.max(1,d-.35);return[st,d,Math.max(5,Math.round(st*5.2))]}function render(){dayCheck();let q=due();document.getElementById('due').textContent=q.length;document.getElementById('known').textContent=Object.values(S.cards).filter(x=>x.reps>0).length;document.getElementById('today').textContent=S.today;document.getElementById('streak').textContent='🔥 '+S.streak;document.getElementById('bar').style.width=Math.min(100,S.today/20*100)+'%';if(!q.length){document.getElementById('area').innerHTML='<div class="card done"><h2>🎉 Tagesziel geschafft</h2><p>Keine Karten mehr fällig. Morgen geht es weiter.</p></div>';return}cur=q[0];document.getElementById('area').innerHTML='<div class="card"><div class="label">'+cur.x[3].toUpperCase()+'</div><div class="word">'+cur.x[0]+'</div><div id="answer" class="hidden"><div class="answer">'+cur.x[1]+'</div><div class="example">'+cur.x[2]+'</div><button class="audio" id="audio">🔊 Aussprache</button></div></div><button class="main" id="show">Antwort zeigen</button><div class="ratings hidden" id="ratings"><button class="again" data-q="again">Nochmal<br>≈ 1 Tag</button><button class="hard" data-q="hard">Schwer<br>≈ 2–4 Tage</button><button class="good" data-q="good">Gut<br>≈ 1 Woche</button><button class="easy" data-q="easy">Leicht<br>≈ 2+ Wochen</button></div>';document.getElementById('show').onclick=()=>{document.getElementById('answer').classList.remove('hidden');document.getElementById('show').classList.add('hidden');document.getElementById('ratings').classList.remove('hidden')};document.getElementById('audio').onclick=()=>{let u=new SpeechSynthesisUtterance(cur.x[1]);u.lang='sk-SK';u.rate=.82;speechSynthesis.cancel();speechSynthesis.speak(u)};document.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>rate(b.dataset.q))}function rate(r){let old=S.cards[cur.i]||{reps:0,st:.5,d:5},z=schedule(old,r);S.cards[cur.i]={reps:(old.reps||0)+1,st:z[0],d:z[1],due:Date.now()+z[2]*86400000};S.today++;save();render()}async function init(){try{CARDS=await fetch('cards.json').then(r=>r.json());document.getElementById('subtitle').textContent=CARDS.length+' Karten • 20 Minuten täglich';let cats=['all',...new Set(CARDS.map(x=>x[3]))];document.getElementById('tabs').innerHTML=cats.map(x=>'<button class="tab '+(x==='all'?'active':'')+'" data-m="'+x+'">'+(x==='all'?'Alle':x)+'</button>').join('');document.getElementById('mode').innerHTML=cats.map(x=>'<option value="'+x+'">'+(x==='all'?'Alle Kategorien':x)+'</option>').join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('mode').value=mode;render()});document.getElementById('mode').onchange=e=>{mode=e.target.value;render()};document.getElementById('reset').onclick=()=>{if(confirm('Lernstand wirklich löschen?')){localStorage.removeItem(KEY);location.reload()}};render()}catch(e){document.getElementById('area').innerHTML='<div class="card"><h2>Fehler beim Laden</h2><p>Bitte Seite neu laden.</p></div>'}}init();</script></body></html>
