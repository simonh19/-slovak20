<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Slovak 20 – 1000 Karten</title><style>*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif;background:#f5f7fb;color:#111827}.wrap{max-width:720px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.brand{font-weight:800;font-size:22px}.stats{font-size:13px;color:#6b7280}.card{background:white;border-radius:24px;padding:36px 24px;min-height:330px;box-shadow:0 8px 30px rgba(0,0,0,.08);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.word{font-size:40px;font-weight:800;margin:15px 0}.answer{font-size:28px;color:#2563eb;margin:14px 0}.example{font-size:17px;color:#6b7280;min-height:25px}.hidden{display:none}.show{margin-top:24px;width:100%;padding:16px;border:0;border-radius:14px;background:#111827;color:white;font-size:17px;font-weight:700}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}.ratings button{border:0;border-radius:12px;padding:14px 5px;background:white;font-weight:700}.again{color:#dc2626}.hard{color:#d97706}.good{color:#059669}.easy{color:#2563eb}.bar{height:8px;background:#e5e7eb;border-radius:99px;margin:16px 0;overflow:hidden}.fill{height:100%;width:0;background:#2563eb}.controls{display:flex;gap:8px;margin:12px 0}.controls select,.controls button{flex:1;padding:11px;border:1px solid #d1d5db;border-radius:12px;background:white}.small{font-size:12px;color:#6b7280;text-align:center;margin-top:12px}</style></head><body><div class="wrap"><div class="top"><div class="brand">🇸🇰 Slovak 20</div><div class="stats" id="stats">Lade…</div></div><div class="controls"><select id="cat"><option value="all">Alle Kategorien</option></select><select id="daily"><option>20</option><option>30</option><option>50</option><option>100</option></select><button id="reset">Reset</button></div><div class="bar"><div class="fill" id="fill"></div></div><div class="card"><div class="word" id="word">Lade…</div><div class="answer hidden" id="answer"></div><div class="example" id="example"></div><button class="show" id="show">Antwort zeigen</button><div class="ratings hidden" id="ratings"><button class="again" data-r="1">Nochmal</button><button class="hard" data-r="2">Schwer</button><button class="good" data-r="3">Gut</button><button class="easy" data-r="4">Leicht</button></div></div><div class="small" id="info"></div></div><script>
const KEY='slovak1000_state_v1';let cards=[],state={},queue=[],idx=0,shown=false;const $=id=>document.getElementById(id);function loadState(){try{state=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){state={}}}function save(){localStorage.setItem(KEY,JSON.stringify(state))}async function get(url){const r=await fetch(url+'?v=1000');if(!r.ok)throw Error(r.status);return r.json()}function normalize(a){return a.map(x=>({de:x[0],sk:x[1],ex:x[2]||'',cat:x[3]||'Grundlagen'}))}async function init(){loadState();try{const [a,b]=await Promise.all([get('cards_1000.json'),get('cards.json')]);const all=normalize(a).concat(normalize(b));const seen=new Set();cards=all.filter(c=>{let k=c.de.toLowerCase()+'|'+c.sk.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,1000);populateCats();start()}catch(e){$('word').textContent='Fehler beim Laden';$('info').textContent=e.message}}function populateCats(){[...new Set(cards.map(c=>c.cat))].sort().forEach(c=>{let o=document.createElement('option');o.value=c;o.textContent=c;$('cat').appendChild(o)})}function today(){return new Date().toISOString().slice(0,10)}function start(){const cat=$('cat').value;const daily=+(localStorage.getItem('daily')||20);$('daily').value=String(daily);const seen=state[today()]||0;const filtered=cat==='all'?cards:cards.filter(c=>c.cat===cat);queue=filtered.filter((c,i)=>!state['card_'+i]).slice(0,daily);if(queue.length===0)queue=filtered.slice(0,daily);idx=0;render();updateStats()}function render(){if(!queue.length){$('word').textContent='Heute fertig 🎉';$('answer').classList.add('hidden');$('show').classList.add('hidden');$('ratings').classList.add('hidden');return}let c=queue[idx];shown=false;$('word').textContent=c.de;$('answer').textContent=c.sk;$('answer').classList.add('hidden');$('example').textContent='';$('show').classList.remove('hidden');$('ratings').classList.add('hidden');$('info').textContent=`Karte ${idx+1} von ${queue.length}`;$('fill').style.width=(idx/queue.length*100)+'%'}function reveal(){let c=queue[idx];shown=true;$('answer').classList.remove('hidden');$('example').textContent=c.ex;$('show').classList.add('hidden');$('ratings').classList.remove('hidden')}function rate(r){let c=queue[idx];let k='card_'+cards.indexOf(c);state[k]={r,date:Date.now()};state[today()]=(state[today()]||0)+1;save();idx++;render();updateStats()}function updateStats(){let learned=Object.keys(state).filter(k=>k.startsWith('card_')).length;let todayN=state[today()]||0;$('stats').textContent=`${cards.length} Karten · heute ${todayN}`;$('fill').style.width=queue.length?idx/queue.length*100+'%':'0%'}$('show').onclick=reveal;document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r));$('cat').onchange=start;$('daily').onchange=e=>{localStorage.setItem('daily',e.target.value);start()};$('reset').onclick=()=>{if(confirm('Lernstand wirklich löschen?')){state={};save();start()}};init();</script></body></html>
