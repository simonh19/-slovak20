<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Slovak 20</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:650px;margin:auto;padding:18px 16px 40px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:3px}.pill{background:#111827;color:#fff;padding:8px 11px;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.stat{background:#fff;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#6b7280}.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#111827;width:0}.tabs{display:flex;gap:7px;overflow-x:auto;margin:12px 0;padding-bottom:3px}.tab{border:0;border-radius:99px;padding:10px 14px;background:#e5e7eb;white-space:nowrap;font-size:14px}.tab.active{background:#111827;color:white}.card{background:#fff;border-radius:25px;min-height:390px;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 7px 28px #0001}.label{font-size:11px;color:#9ca3af;letter-spacing:.1em}.word{font-size:40px;font-weight:800;margin:25px 0 10px}.answer{font-size:29px;font-weight:750;margin:12px 0}.main{width:100%;margin-top:14px;border:0;border-radius:15px;background:#111827;color:white;padding:15px;font-weight:750;font-size:16px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.ratings button{border:0;border-radius:14px;padding:12px 3px;font-weight:700;font-size:12px}.again{background:#fee2e2}.hard{background:#fef3c7}.good{background:#dcfce7}.easy{background:#dbeafe}.audio{border:0;border-radius:13px;padding:10px 14px;margin-top:12px;background:#e5e7eb}.panel{background:#fff;border-radius:18px;padding:16px;margin-top:14px}.row{display:flex;gap:12px;align-items:center}.row input{flex:1}.row b{min-width:36px;text-align:right}.hidden{display:none!important}.done{text-align:center;padding:60px 15px}.reset{margin-top:12px;border:0;background:#e5e7eb;border-radius:12px;padding:11px}.note{font-size:11px;color:#9ca3af;margin-top:10px;line-height:1.4}.loading{padding:50px 20px;text-align:center}.error{padding:30px;text-align:center;color:#991b1b}</style></head><body><main class="app"><header><div><h1>Slovak 20</h1><div class="sub" id="sub">Lade 3.000 Vokabeln …</div></div><div class="pill" id="streak">🔥 0</div></header><div class="stats"><div class="stat"><b id="due">–</b><span>fällig</span></div><div class="stat"><b id="known">0</b><span>gelernt</span></div><div class="stat"><b id="today">0</b><span>heute neu</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div><div id="area"><div class="card loading">⏳<br><br>Ich lade die 3.000 Vokabeln …</div></div><div class="panel"><div class="row"><input id="target" type="range" min="5" max="100" step="5" value="20"><b id="targetText">20</b></div><div class="note">Tagesziel = neue Karten. Fällige Wiederholungen kommen zusätzlich dazu und zählen nicht gegen das Tagesziel.</div><button class="reset" id="reset">Lernstand zurücksetzen</button></div></main><script type="module">import{fsrs,createEmptyCard,Rating}from'https://cdn.jsdelivr.net/npm/ts-fsrs@latest/+esm';const FREQ='https://raw.githubusercontent.com/hermitdave/FrequencyWords/master/content/2016/sk/sk_50k.txt';const DICT='https://raw.githubusercontent.com/open-dict-data/wikidict-de/master/data/sk-de_wiki.txt';const KEY='slovak20-fsrs-3000';const S=JSON.parse(localStorage.getItem(KEY)||'{}');S.cards=S.cards||{};S.day=S.day||new Date().toISOString().slice(0,10);S.today=S.today||0;S.streak=S.streak||0;S.target=S.target||20;let C=[],cat='Alle',cur=null;const $=x=>document.getElementById(x),scheduler=fsrs({request_retention:.9,maximum_interval:36500,enable_fuzz:true,enable_short_term:true,learning_steps:['1m','10m'],relearning_steps:['10m']});function save(){localStorage.setItem(KEY,JSON.stringify(S))}function esc(x){return x.replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function category(sk){const s=sk.toLowerCase();if(/hotel|izb|recepc|raňaj|večer|reštaur|bar|hosť|rezerv|účet|uterák|posteľ|kúpeľ|sprch|toalet|wlan|klimatiz/.test(s))return'Hotel';if(/jedlo|voda|pivo|víno|chlieb|syr|mäso|ryb|ovoc|zelen|káva|čaj|poliev|raňaj|večer/.test(s))return'Essen';if(/dnes|zajtra|včera|ráno|večer|noc|pondel|utor|stred|štvrt|piatok|sobot|nedeľ|týždeň|mesiac|rok|hodin|minút|čas/.test(s))return'Zeit';if(/auto|vlak|letisk|liet|cest|hotel|ulic|stanic|map|mesto|dedin|krajina|hran|cest/.test(s))return'Reisen';if(/hovori|uči|rozum|vedie|pozna|byť|mať|robi|ísť|prís|čaka|potreb|chcie|môc|mus|dať|vzia|jesť|piť|spať|prac|býva|cest|kúpi|otvor|zatvor|zača|skonč/.test(s))return'Verben';if(/zdrav|lekár|chor|bolesť|krv|srdce|mozog|koža|zub|nemoc/.test(s))return'Gesundheit';if(/počíta|internet|telefón|softvér|program|web|kamera|obraz|kláves/.test(s))return'Technik';if(/les|strom|rieka|jazero|more|hora|slnko|dážď|sneh|vietor|oheň|kvet|zviera/.test(s))return'Natur';if(/práca|hotel|šéf|firma|spoločnosť|peniaze|cena|plat|účet/.test(s))return'Arbeit';return'Alltag'}function build(freqText,dictText){const dm=new Map();for(const line of dictText.split(/\r?\n/)){const p=line.split('\t');if(p.length<2)continue;const sk=p[0].trim(),de=p.slice(1).join(' ').trim();if(!sk||!de)continue;const k=sk.toLowerCase();if(!dm.has(k))dm.set(k,de)}const seen=new Set(),out=[];const add=(sk,de,rank=99999)=>{const k=sk.toLowerCase();if(seen.has(k)||!sk||!de)return;if(!/^[\p{L}][\p{L}'’-]{1,24}$/u.test(sk))return;if(/[0-9_:#]/.test(de)||de.length>70)return;seen.add(k);out.push({id:k,sk,de,cat:category(sk),rank})};const freq=[];for(const line of freqText.split(/\r?\n/)){const p=line.trim().split(/\s+/);if(p.length>=2){const n=Number(p.at(-1));const w=p.slice(0,-1).join(' ');if(Number.isFinite(n))freq.push([w,n])}}freq.sort((a,b)=>b[1]-a[1]);for(const [w,n] of freq){const de=dm.get(w.toLowerCase());if(de)add(w,de,n);if(out.length>=3000)break}if(out.length<3000)for(const [sk,de] of dm){if(out.length>=3000)break;add(sk,de)}return out.slice(0,3000)}function dayCheck(){const t=new Date().toISOString().slice(0,10);if(S.day!==t){const a=new Date(S.day),b=new Date(t);S.streak=(b-a)/86400000===1?S.streak+1:1;S.day=t;S.today=0;save()}}function cardOf(id){const c=S.cards[id];if(!c)return createEmptyCard();for(const k of ['due','last_review'])if(c[k])c[k]=new Date(c[k]);return c}function isNew(x){return !S.cards[x.id]||!S.cards[x.id].reps}function queue(){const n=Date.now(),filtered=C.filter(x=>cat==='Alle'||x.cat===cat),due=filtered.filter(x=>S.cards[x.id]&&S.cards[x.id].reps&&new Date(S.cards[x.id].due||0).getTime()<=n),fresh=filtered.filter(isNew).slice(0,Math.max(0,S.target-S.today));return [...due,...fresh]}function render(){dayCheck();$('sub').textContent=C.length+' Vokabeln • FSRS';const q=queue(),dueCount=C.filter(x=>(cat==='Alle'||x.cat===cat)&&S.cards[x.id]&&S.cards[x.id].reps&&new Date(S.cards[x.id].due||0).getTime()<=Date.now()).length;$('due').textContent=dueCount;$('known').textContent=Object.values(S.cards).filter(x=>x.reps).length;$('today').textContent=S.today;$('streak').textContent='🔥 '+S.streak;$('bar').style.width=Math.min(100,S.today/S.target*100)+'%';$('target').value=S.target;$('targetText').textContent=S.target;if(!q.length){$('area').innerHTML='<div class="card done"><h2>'+ (S.today>=S.target?'🎉 Tagesziel erreicht':'Keine Karten fällig') +'</h2><p>'+(S.today>=S.target?'Du hast '+S.today+' neue Vokabeln gelernt. Fällige Wiederholungen sind zusätzlich erledigt.':'In dieser Kategorie ist aktuell nichts fällig.')+'</p></div>';return}cur=q[0];const fresh=isNew(cur);$('area').innerHTML='<div class="card"><div class="label">'+esc(cur.cat)+(fresh?' · NEU':' · WIEDERHOLUNG')+'</div><div class="word">'+esc(cur.de)+'</div><div id="answer" class="hidden"><div class="answer">'+esc(cur.sk)+'</div><button class="audio" id="audio">🔊 Aussprache</button></div></div><button class="main" id="show">Antwort zeigen</button><div class="ratings hidden" id="ratings"><button class="again" data-r="1">Nochmal</button><button class="hard" data-r="2">Schwer</button><button class="good" data-r="3">Gut</button><button class="easy" data-r="4">Leicht</button></div>';$('show').onclick=()=>{$('answer').classList.remove('hidden');$('show').classList.add('hidden');$('ratings').classList.remove('hidden')};$('audio').onclick=()=>{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(cur.sk);u.lang='sk-SK';u.rate=.82;speechSynthesis.speak(u)};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r))}function rate(r){const wasNew=isNew(cur),old=cardOf(cur.id),result=scheduler.next(old,new Date(),{1:Rating.Again,2:Rating.Hard,3:Rating.Good,4:Rating.Easy}[r]),c=result.card;S.cards[cur.id]={...c,due:c.due.toISOString(),last_review:c.last_review?c.last_review.toISOString():null,reps:(S.cards[cur.id]?.reps||0)+1};if(wasNew)S.today++;save();render()}$('target').oninput=e=>{S.target=+e.target.value;save();render()};$('reset').onclick=()=>{if(confirm('Lernstand wirklich löschen?')){localStorage.removeItem(KEY);location.reload()}};Promise.all([fetch(FREQ).then(r=>r.text()),fetch(DICT).then(r=>r.text())]).then(([f,d])=>{C=build(f,d);const cats=['Alle',...new Set(C.map(x=>x.cat))];$('tabs').innerHTML=cats.map(x=>'<button class="tab '+(x===cat?'active':'')+'" data-cat="'+x+'">'+x+'</button>').join('');document.querySelectorAll('[data-cat]').forEach(b=>b.onclick=()=>{cat=b.dataset.cat;document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x===cat));render()});render()}).catch(e=>{$('area').innerHTML='<div class="card error"><h2>Vokabeln konnten nicht geladen werden</h2><p>Bitte Seite neu laden.</p></div>';console.error(e)})</script></body></html>
