<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111827"><title>Slovak 20</title><style>*{box-sizing:border-box}body{margin:0;background:#f3f4f6;color:#111827;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",Arial,sans-serif}.app{max-width:650px;margin:auto;padding:18px 16px 40px}header{display:flex;justify-content:space-between;align-items:center}h1{font-size:28px;margin:0}.sub{color:#6b7280;font-size:13px;margin-top:3px}.pill{background:#111827;color:#fff;padding:8px 11px;border-radius:99px;font-size:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:18px 0 12px}.stat{background:#fff;border-radius:15px;padding:12px;text-align:center}.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:#6b7280}.progress{height:6px;background:#e5e7eb;border-radius:99px;overflow:hidden;margin:14px 0}.bar{height:100%;background:#111827;width:0}.tabs{display:flex;gap:7px;overflow:auto;margin:12px 0}.tab{border:0;border-radius:99px;padding:9px 12px;background:#e5e7eb;white-space:nowrap}.tab.active{background:#111827;color:white}.card{background:#fff;border-radius:25px;min-height:390px;padding:30px 22px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;box-shadow:0 7px 28px #0001}.label{font-size:11px;color:#9ca3af;letter-spacing:.1em}.word{font-size:40px;font-weight:800;margin:25px 0 10px}.answer{font-size:29px;font-weight:750;margin:12px 0}.example{font-size:15px;color:#4b5563;line-height:1.5;max-width:500px}.main{width:100%;margin-top:14px;border:0;border-radius:15px;background:#111827;color:white;padding:15px;font-weight:750;font-size:16px}.ratings{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:12px}.ratings button{border:0;border-radius:14px;padding:12px 3px;font-weight:700;font-size:12px}.again{background:#fee2e2}.hard{background:#fef3c7}.good{background:#dcfce7}.easy{background:#dbeafe}.audio{border:0;border-radius:13px;padding:10px 14px;margin-top:12px;background:#e5e7eb}.panel{background:#fff;border-radius:18px;padding:16px;margin-top:14px}.panel select,.panel input{width:100%;padding:11px;border-radius:11px;border:1px solid #d1d5db;background:white}.row{display:flex;gap:12px;align-items:center}.row input{flex:1}.row b{min-width:36px;text-align:right}.setting{margin-top:12px}.setting label{font-size:12px;color:#6b7280;display:block;margin-bottom:6px}.hidden{display:none!important}.done{text-align:center;padding:60px 15px}.reset{margin-top:12px;border:0;background:#e5e7eb;border-radius:12px;padding:11px}.note{font-size:11px;color:#9ca3af;margin-top:10px;line-height:1.4}</style></head><body><main class="app"><header><div><h1>Slovak 20</h1><div class="sub">FSRS • Tagesziel frei wählbar</div></div><div class="pill" id="streak">🔥 0</div></header><div class="stats"><div class="stat"><b id="due">0</b><span>fällig</span></div><div class="stat"><b id="known">0</b><span>gelernt</span></div><div class="stat"><b id="today">0</b><span>heute</span></div></div><div class="progress"><div class="bar" id="bar"></div></div><div class="tabs" id="tabs"></div><div id="area"></div><div class="panel"><div class="setting"><label>Tagesziel</label><div class="row"><input id="target" type="range" min="5" max="100" step="5" value="20"><b id="targetText">20</b></div></div><div class="setting"><label>Kategorie</label><select id="mode"></select></div><button class="reset" id="reset">Lernstand zurücksetzen</button><div class="note">Standard sind 20 Karten. Du kannst jederzeit z.B. 40, 60 oder 100 Karten pro Tag einstellen. FSRS plant die Wiederholungen anhand deiner Antworten.</div></div></main><script type="module">import{fsrs,createEmptyCard,Rating}from'https://cdn.jsdelivr.net/npm/ts-fsrs@latest/+esm';const C=[['Danke','Ďakujem','Ďakujem veľmi pekne.','Service'],['Bitte','Prosím','Prosím, posaďte sa.','Service'],['Guten Morgen','Dobré ráno','Dobré ráno!','Phrases'],['Entschuldigung','Prepáčte','Prepáčte, kde ist hotel?','Service'],['Wie geht es dir?','Ako sa máš?','Ako sa máš?','Phrases'],['Wo ist das Hotel?','Kde je hotel?','Kde je hotel?','Reisen'],['Wie viel kostet das?','Koľko to stojí?','Koľko to stojí?','Phrases'],['Ich verstehe nicht','Nerozumiem','Prepáčte, nerozumiem.','Phrases'],['Bitte langsamer','Pomalšie, prosím.','Môžete hovoriť pomalšie, prosím?','Phrases'],['Ich brauche Hilfe','Potrebujem pomoc.','Potrebujem pomoc.','Service'],['Ich habe eine Reservierung','Mám rezerváciu','Mám rezerváciu na meno Simon.','Hotel'],['Zimmer','Izba','Vaša izba je na druhom poschodí.','Hotel'],['Frühstück','Raňajky','Raňajky sú od siedmej.','Hotel'],['Rechnung','Účet','Prosím si účet.','Hotel'],['Wasser','Voda','Prosím si vodu.','Essen'],['Ich möchte bezahlen','Chcem zaplatiť','Chcem zaplatiť, prosím.','Essen'],['Wo ist die Toilette?','Kde je toaleta?','Kde je toaleta?','Hotel'],['Heute','Dnes','Dnes pracujem.','Zeit'],['Morgen','Zajtra','Zajtra pracujem.','Zeit'],['Bis morgen','Dovidenia zajtra','Dovidenia zajtra!','Phrases']];const KEY='slovak20-fsrs-v3',S=JSON.parse(localStorage.getItem(KEY)||'{}');S.cards=S.cards||{};S.day=S.day||new Date().toISOString().slice(0,10);S.today=S.today||0;S.streak=S.streak||0;S.target=S.target||20;let mode='all',cur=null;const scheduler=fsrs({request_retention:.9,maximum_interval:36500,enable_fuzz:true,enable_short_term:true,learning_steps:['1m','10m'],relearning_steps:['10m']});function save(){localStorage.setItem(KEY,JSON.stringify(S))}function checkDay(){let t=new Date().toISOString().slice(0,10);if(S.day!==t){let a=new Date(S.day),b=new Date(t);S.streak=(b-a)/86400000===1?S.streak+1:1;S.day=t;S.today=0;save()}}function cardOf(i){let c=S.cards[i];if(!c)return createEmptyCard();for(let k of ['due','last_review'])if(c[k])c[k]=new Date(c[k]);return c}function queue(){let n=Date.now();return C.map((x,i)=>({x,i})).filter(o=>mode==='all'||o.x[3]===mode).filter(o=>!S.cards[o.i]||new Date(S.cards[o.i].due||0).getTime()<=n)}function render(){checkDay();let q=queue();document.getElementById('due').textContent=q.length;document.getElementById('known').textContent=Object.values(S.cards).filter(x=>x.reps).length;document.getElementById('today').textContent=S.today;document.getElementById('streak').textContent='🔥 '+S.streak;document.getElementById('bar').style.width=Math.min(100,S.today/S.target*100)+'%';document.getElementById('target').value=S.target;document.getElementById('targetText').textContent=S.target;if(S.today>=S.target){document.getElementById('area').innerHTML='<div class="card done"><h2>🎉 Tagesziel erreicht</h2><p>'+S.today+' Karten heute.</p><p>Mehr? Erhöhe unten dein Tagesziel.</p></div>';return}if(!q.length){document.getElementById('area').innerHTML='<div class="card done"><h2>Keine Karten fällig</h2><p>Du bist aktuell durch.</p></div>';return}cur=q[0];document.getElementById('area').innerHTML='<div class="card"><div class="label">'+cur.x[3].toUpperCase()+'</div><div class="word">'+cur.x[0]+'</div><div id="answer" class="hidden"><div class="answer">'+cur.x[1]+'</div><div class="example">'+cur.x[2]+'</div><button class="audio" id="audio">🔊 Aussprache</button></div></div><button class="main" id="show">Antwort zeigen</button><div class="ratings hidden" id="ratings"><button class="again" data-r="1">Nochmal</button><button class="hard" data-r="2">Schwer</button><button class="good" data-r="3">Gut</button><button class="easy" data-r="4">Leicht</button></div>';document.getElementById('show').onclick=()=>{answer.classList.remove('hidden');show.classList.add('hidden');ratings.classList.remove('hidden')};document.getElementById('audio').onclick=()=>{speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(cur.x[1]);u.lang='sk-SK';u.rate=.82;speechSynthesis.speak(u)};document.querySelectorAll('[data-r]').forEach(b=>b.onclick=()=>rate(+b.dataset.r));let answer=document.getElementById('answer'),show=document.getElementById('show'),ratings=document.getElementById('ratings')}function rate(r){let old=cardOf(cur.i),rating={1:Rating.Again,2:Rating.Hard,3:Rating.Good,4:Rating.Easy}[r],result=scheduler.next(old,new Date(),rating),c=result.card;S.cards[cur.i]={...c,due:c.due.toISOString(),last_review:c.last_review?c.last_review.toISOString():null,reps:(S.cards[cur.i]?.reps||0)+1};S.today++;save();render()}let cats=['all',...new Set(C.map(x=>x[3]))];tabs.innerHTML=cats.map(x=>'<button class="tab '+(x==='all'?'active':'')+'" data-m="'+x+'">'+(x==='all'?'Alle':x)+'</button>').join('');modeEl=document.getElementById('mode');modeEl.innerHTML=cats.map(x=>'<option value="'+x+'">'+(x==='all'?'Alle Kategorien':x)+'</option>').join('');document.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{mode=b.dataset.m;document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');modeEl.value=mode;render()});modeEl.onchange=e=>{mode=e.target.value;render()};target.oninput=e=>{S.target=+e.target.value;targetText.textContent=S.target;save();render()};reset.onclick=()=>{if(confirm('Lernstand wirklich löschen?')){localStorage.removeItem(KEY);location.reload()}};render();</script></body></html>
