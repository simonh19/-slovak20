name: Deploy Slovak 20 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Prepare 1000-card database
        run: |
          cp cards_1000.json cards.json
          python - <<'PY'
          import json
          with open('cards_1000.json', encoding='utf-8') as f:
              cards = json.load(f)
          assert len(cards) == 1000, f'Expected exactly 1000 cards, got {len(cards)}'
          print('Verified exactly 1000 cards')
          PY
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
